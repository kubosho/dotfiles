"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
scan_timeout = 10
# custom.jj spawns jj, whose startup exceeds the 500ms default under load
command_timeout = 1000

format = """
[](fg:north)\
$directory\
${custom.jj}\
$git_branch\
$git_status\
[](fg:north)
$character\
"""

palette = 'trapezium'
[palettes.trapezium]
east = '#83cbec'
west = '#feca8b'
south = '#f57988'
north = '#58c3a9'
text = '#1a1b26'

[directory]
format = "[ $path$read_only](bg:north fg:text bold)"

# Jujutsu VCS integration
[custom.jj]
description = "Jujutsu VCS status"
command = '''
jj log -r @ -n1 --no-graph --ignore-working-copy -T '
separate(" ",
  bookmarks.map(|x| if(x.remote(), "", x.name())).join(" "),
  tags.map(|x| x.name()).join(" "),
  if(conflict, "󰀨"),
  if(divergent, "󰓢"),
  if(hidden, "󰈉"),
  if(empty, "○", "●"),
  surround("\"", "\"", truncate_end(24, description.first_line(), "…")),
)
'
'''
# Keep the command above as the only jj invocation: it fails outside a jj repo,
# and the () around format drops the whole group when $output is empty
when = true
symbol = "🥋"
format = "([  $symbol$output](bg:north fg:text bold))"
shell = ["sh", "--norc", "--noprofile"]

[git_branch]
format = "[  $symbol$branch](bg:north fg:text bold)"

[git_status]
format = "[$all_status$ahead_behind](bg:north fg:text bold)"

[character]
success_symbol = "[❯](west)"
error_symbol = "[❯](south)"
